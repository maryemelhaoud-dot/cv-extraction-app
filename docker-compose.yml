services:
  db:
    image: postgres:15-alpine
    container_name: cv_postgres
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${DB_NAME:-cv_extraction}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Gvnysend}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-cv_extraction}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ocr-service:
    build:
      context: ./ocr-service
    container_name: cv_ocr_service
    ports:
      - "8001:8001"
    env_file:
      - ./ocr-service/.env
    volumes:
      - ./ocr-service:/app

  backend:
    build:
      context: ./backend
    container_name: cv_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - OCR_SERVICE_URL=http://ocr-service:8001/extract
    depends_on:
      db:
        condition: service_healthy
      ocr-service:
        condition: service_started
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: cv_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  pgdata:
